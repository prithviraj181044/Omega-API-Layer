# Project-local fixed catalogue text. Human terminology/translation review remains pending.
GW_SEC_001.title=Invalid request
GW_SEC_001.detail=The request does not meet the gateway security requirements.
GW_SEC_001.resolution=Correct the request and submit it again.
GW_IPF_001.title=Access denied
GW_IPF_001.detail=Access from this network is not permitted.
GW_IPF_001.resolution=Contact support if access is required.
GW_AUTH_001.title=Authentication required
GW_AUTH_001.detail=The access token is missing or not valid.
GW_AUTH_001.resolution=Obtain a valid access token and submit the request again.
GW_AUTH_002.title=Permission denied
GW_AUTH_002.detail=The authenticated caller is not permitted to perform this operation.
GW_AUTH_002.resolution=Request the required permission through the approved process.
GW_SCH_001.title=Request validation failed
GW_SCH_001.detail=The request body does not meet the registered API requirements.
GW_SCH_001.resolution=Correct the request using the API documentation.
GW_PRI_001.title=Capacity unavailable
GW_PRI_001.detail=The request cannot be admitted at the current capacity.
GW_PRI_001.resolution=Follow the Retry-After header before submitting another request.
GW_RTL_001.title=Request limit exceeded
GW_RTL_001.detail=The permitted request rate has been exceeded.
GW_RTL_001.resolution=Follow the Retry-After header before submitting another request.
GW_THR_001.title=Concurrency limit exceeded
GW_THR_001.detail=The permitted number of concurrent requests has been exceeded.
GW_THR_001.resolution=Follow the Retry-After header before submitting another request.
GW_RTE_001.title=Routing unavailable
GW_RTE_001.detail=The request cannot currently be forwarded.
GW_RTE_001.resolution=Check the request outcome before retrying when service is restored.
GW_CBK_001.title=Service temporarily unavailable
GW_CBK_001.detail=A required service is temporarily unavailable.
GW_CBK_001.resolution=Check the request outcome and follow the Retry-After header.
GW_TMO_001.title=Request timed out
GW_TMO_001.detail=The operation did not complete within the permitted time.
GW_TMO_001.resolution=Check the operation outcome before submitting it again.
GW_INT_001.title=Unexpected gateway error
GW_INT_001.detail=The gateway could not complete the request.
GW_INT_001.resolution=Contact support with the correlation identifier.
ONBOARDING_VALIDATION_REQUIRED.title=Specification validation required
ONBOARDING_VALIDATION_REQUIRED.detail=A valid specification-validation result is required before metadata persistence.
ONBOARDING_VALIDATION_REQUIRED.resolution=Validate the specification and use the returned validation token.
ONBOARDING_SPECIFICATION_INVALID.title=Invalid API specification
ONBOARDING_SPECIFICATION_INVALID.detail=The submitted API specification does not meet the validation requirements.
ONBOARDING_SPECIFICATION_INVALID.resolution=Correct the specification using the reported safe validation details.
ONBOARDING_LIFECYCLE_TRANSITION_INVALID.title=Invalid lifecycle transition
ONBOARDING_LIFECYCLE_TRANSITION_INVALID.detail=The requested API lifecycle transition is not permitted.
ONBOARDING_LIFECYCLE_TRANSITION_INVALID.resolution=Check the current lifecycle state and use a permitted transition.
ONBOARDING_API_NOT_FOUND.title=API definition not found
ONBOARDING_API_NOT_FOUND.detail=The requested API definition is unavailable or not accessible.
ONBOARDING_API_NOT_FOUND.resolution=Check the API identifier, version and access permissions.
EVENT_SUBSCRIPTION_NOT_FOUND.title=Subscription not found
EVENT_SUBSCRIPTION_NOT_FOUND.detail=The requested event subscription is unavailable or not accessible.
EVENT_SUBSCRIPTION_NOT_FOUND.resolution=Check the subscription identifier and access permissions.
EVENT_SUBSCRIPTION_FORBIDDEN.title=Subscription permission denied
EVENT_SUBSCRIPTION_FORBIDDEN.detail=The caller is not permitted to access or modify this subscription.
EVENT_SUBSCRIPTION_FORBIDDEN.resolution=Use an authorised owner or administrator identity.
EVENT_CALLBACK_URL_INVALID.title=Invalid callback address
EVENT_CALLBACK_URL_INVALID.detail=The callback address does not meet the approved security requirements.
EVENT_CALLBACK_URL_INVALID.resolution=Use an approved public HTTPS callback address.
EVENT_METADATA_MISSING.title=Required event metadata missing
EVENT_METADATA_MISSING.detail=Required event metadata is missing or incomplete.
EVENT_METADATA_MISSING.resolution=Supply all required event metadata fields.
EVENT_SCHEMA_INCOMPATIBLE.title=Incompatible event schema
EVENT_SCHEMA_INCOMPATIBLE.detail=The event schema does not meet the required compatibility policy.
EVENT_SCHEMA_INCOMPATIBLE.resolution=Use a schema compatible with the registered event contract.
EVENT_SCHEMA_VIOLATION.title=Event schema validation failed
EVENT_SCHEMA_VIOLATION.detail=The event does not meet its registered schema requirements.
EVENT_SCHEMA_VIOLATION.resolution=Correct the event using the registered schema.
EVENT_STREAM_TOKEN_EXPIRED.title=Stream authentication expired
EVENT_STREAM_TOKEN_EXPIRED.detail=Authentication for the event stream has expired.
EVENT_STREAM_TOKEN_EXPIRED.resolution=Obtain a valid access token before reconnecting.
PLATFORM_DEPENDENCY_UNAVAILABLE.title=Dependency unavailable
PLATFORM_DEPENDENCY_UNAVAILABLE.detail=A required dependency is temporarily unavailable.
PLATFORM_DEPENDENCY_UNAVAILABLE.resolution=Check the operation outcome before retrying when the dependency is restored.
